# Template for the HOST nginx (TLS terminated here). Replace tms-demo.example.com and the cert paths.
# Obtain the certificate with:  certbot --nginx -d tms-demo.example.com
server {
  listen 80;
  server_name tms-demo.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name tms-demo.example.com;
  ssl_certificate     /etc/letsencrypt/live/tms-demo.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tms-demo.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 5m;
  location / {
    proxy_pass http://127.0.0.1:8480;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
